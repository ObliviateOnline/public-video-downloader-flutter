name: Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build windows --release
      - name: Add Windows runtime resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows/x64/runner/Release/data/flutter_assets/resources | Out-Null
          Copy-Item resources/* build/windows/x64/runner/Release/data/flutter_assets/resources -Force
      - name: Build Windows installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/public_video_downloader.iss
          options: /DMyAppVersion=1.0.4 /Orelease-assets/windows
      - name: Package Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets/windows | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath release-assets/windows/public-video-downloader-windows.zip
          Copy-Item build/windows/x64/runner/Release/public_video_downloader.exe release-assets/windows/public_video_downloader.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-assets/windows

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release
      - name: Prepare Android release asset
        run: |
          mkdir -p release-assets/android
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/android/public-video-downloader-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-assets/android

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/windows-release/public-video-downloader-windows.zip
            release-assets/windows-release/public_video_downloader.exe
            release-assets/windows-release/public-video-downloader-setup-*.exe
            release-assets/android-release/public-video-downloader-android.apk

name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build windows --release
      - name: Add Windows runtime resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows/x64/runner/Release/data/flutter_assets/resources | Out-Null
          Copy-Item resources/* build/windows/x64/runner/Release/data/flutter_assets/resources -Force
      - name: Build Windows installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/public_video_downloader.iss
          options: /DMyAppVersion=1.0.4 /Orelease-assets/windows
      - name: Package Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets/windows | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath release-assets/windows/public-video-downloader-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: public-video-downloader-windows
          path: release-assets/windows
